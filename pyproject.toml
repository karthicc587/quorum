[project]
name = "quorum-ai"
version = "0.1.0"
description = "A disclosed AI meeting delegate with bounded autonomy"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "rapidfuzz>=3.6",
    "numpy>=1.26",              # imported at module level by tts and pipeline
    "python-multipart>=0.0.9",  # required by FastAPI for the enrollment upload
]

[project.optional-dependencies]
# installed by setup.sh once your hardware tier is known
audio = ["faster-whisper>=1.0", "sounddevice>=0.4", "silero-vad>=5.1"]
voice = ["TTS>=0.22"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx", "playwright"]

[tool.setuptools]
# Without this, setuptools auto-discovery sees quorum/, static/ and voices/
# as three competing top-level packages and refuses to build.
packages = ["quorum"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
